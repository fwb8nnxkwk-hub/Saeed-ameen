<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الفواتير</title>
<link rel="manifest" href="./manifest.json"><link rel="stylesheet" href="./styles.css"></head>
<body>
<header><h1>الفواتير</h1><a href="./index.html" class="back">العودة</a></header>
<main class="container">
  <div class="panel">
    <div class="panel-head"><h3>إدارة الفواتير</h3><div><button id="newInvoice">إنشاء فاتورة جديدة</button><button id="importInvoices">استيراد فواتير</button><input type="file" id="importInvoicesFile" style="display:none"></div></div>
    <input id="searchInv" placeholder="بحث برقم الفاتورة أو اسم العميل">
    <div class="table-wrap"><table id="invoicesTable"><thead><tr><th>رقم</th><th>تاريخ</th><th>عميل</th><th>المجموع</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody></tbody></table></div>
  </div>
  <div class="panel">
    <h3>تصدير الفواتير</h3>
    <button id="exportInvoicesJSON">تصدير JSON</button>
    <button id="exportInvoicesCSV">تصدير CSV</button>
  </div>
</main>
<div id="modal" class="modal hidden"><div class="modal-box"><h3 id="modalTitle"></h3><div id="modalBody"></div><div class="modal-actions"><button id="modalCancel">إلغاء</button><button id="modalSave">حفظ</button></div></div></div>
<script src="./app_professional.js"></script>
</body></html>
